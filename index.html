<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hierarchical Edge Bundling</title>

    <link rel="stylesheet" href="style.css">
    <script type="module" src="./src/overlay.js"></script>
</head>
<body>

<div id="container">
    <div id="status"></div>

    <canvas id="canvas"></canvas>

    <folder-overlay id="overlay"></folder-overlay>
</div>

<script src="https://d3js.org/d3.v4.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"></script>

<script type="module">
import { status, StatusType } from "./src/status.js"
import { renderVisualization } from "./src/app.js"

import { store } from "./src/store.js"

store.set({
    json: "examples/linus-linux/root.json",

    // app
    scale: 2,
    show_folders: true,
    method: "radial",
    square_radius: 16,
    start_color: { r: 0.03, g: 0.18, b: 0.87, alpha: 0.01 },
    end_color: { r: 0.03, g: 0.18, b: 0.42, alpha: 0.50 },
    width: window.innerWidth,
    height: window.innerHeight,
    
    line_width: 0.05, // px
    segments: 16,
    
    padding: 120,
    depth: -1,
    arc_width: 1.0,

    context_type: "webgl2"
})

const diameter = Math.min(store.get("width"), store.get("height"));
store.set({ "inner_radius": (diameter / 2) - store.get("padding") })

const canvas = document.querySelector("canvas");
canvas.width = diameter;
canvas.height = diameter;

status.init({
    body: document.body,
    element: document.querySelector("#status")
});

try {
    status.set("Loading...");
    status.loading();

    const response = await fetch(store.get("json"));

    if (!response.ok) {
        status.set(response.status, { type: StatusType.ERROR });
        throw response.status;
    }

    const json = await response.json();
    const data = json.data;
    renderVisualization(canvas, data);

    status.loadingEnd();
} catch (error) {
    status.set(error, { type: StatusType.ERROR });
}
</script>
</body>
</html>
